version: 2.1
workflows:
  testing:
    jobs:
      - build-firmware
      - unit-tests
      - e2e-tests:
          requires:
            - build-firmware
jobs:
  unit-tests:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-cmake-bin-4.3.4
            - v1-cmake-bin-
      - run:
          name: Fetch submodules
          command: |
            git submodule update --init --recursive
      - run:
          name: Install CMake
          command: |
            CMAKE=$HOME/.local/cmake/bin/cmake
            if ! $CMAKE --version &>/dev/null; then
              mkdir -p $HOME/.local/cmake
              curl -fsSL https://github.com/Kitware/CMake/releases/download/v4.3.4/cmake-4.3.4-linux-x86_64.tar.gz \
                | tar -xz -C $HOME/.local/cmake --strip-components=1
            fi
            echo 'export PATH=$HOME/.local/cmake/bin:$PATH' >> $BASH_ENV
      - save_cache:
          key: v1-cmake-bin-4.3.4
          paths:
            - ~/.local/cmake
      - run:
          name: Build tests
          command: |
            cmake -S . -B build
            cmake --build build -j2
      - run:
          name: Run unit tests
          command: ./build/home_automation_test
  build-firmware:
    docker:
      - image: cimg/base:current
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-arduino-deps-{{ checksum ".circleci/config.yml" }}
            - v1-arduino-deps-
      - run:
          name: Install arduino-cli
          command: |
            echo 'export PATH=$HOME/.local/bin:$PATH' >> $BASH_ENV
            export PATH=$HOME/.local/bin:$PATH
            if ! command -v arduino-cli &>/dev/null; then
              curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/.local/bin sh
            fi
      - run:
          name: Install ESP8266 core
          command: |
            export PATH=$HOME/.local/bin:$PATH
            if ! arduino-cli core list 2>/dev/null | grep -q esp8266; then
              arduino-cli config init
              arduino-cli config set board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
              arduino-cli core update-index
              arduino-cli core install esp8266:esp8266
            fi
      - run:
          name: Install libraries
          command: |
            export PATH=$HOME/.local/bin:$PATH
            for lib in "Adafruit MCP3008" "DallasTemperature" "DHT sensor library" "OneWire" "PubSubClient" "Grove - Laser PM2.5 Sensor HM3301" "HLW8012"; do
              arduino-cli lib list | grep -qF "$lib" || arduino-cli lib install "$lib"
            done
      - save_cache:
          key: v1-arduino-deps-{{ checksum ".circleci/config.yml" }}
          paths:
            - ~/.local/bin
            - ~/.arduino15
            - ~/Arduino
      - run:
          name: Compile firmware
          command: |
            mkdir -p /tmp/sketch/home_automation
            cp -r src *.ino /tmp/sketch/home_automation/
            arduino-cli compile --fqbn esp8266:esp8266:generic --output-dir /tmp/firmware /tmp/sketch/home_automation
      - persist_to_workspace:
          root: /tmp
          paths:
            - firmware
  e2e-tests:
    machine: true
    resource_class: petersohn/esp_rpi
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - run:
          name: Install arduino-cli on RPi
          command: |
            echo 'export PATH=$HOME/.local/bin:$PATH' >> $BASH_ENV
            export PATH=$HOME/.local/bin:$PATH
            if ! command -v arduino-cli &>/dev/null; then
              curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/.local/bin sh
            fi
      - run:
          name: Install ESP8266 core on RPi
          command: |
            export PATH=$HOME/.local/bin:$PATH
            if ! arduino-cli core list 2>/dev/null | grep -q esp8266; then
              arduino-cli config init
              arduino-cli config set board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
              arduino-cli core update-index
              arduino-cli core install esp8266:esp8266
            fi
      - run:
          name: Install Python dependencies
          command: |
            pip3 install --break-system-packages pytest pytest-timeout paho-mqtt pyserial
      - run:
          name: Upload firmware
          command: |
            cd e2e
            PYTHONPATH=$PWD python3 upload_firmware.py /tmp/firmware/home_automation.ino.bin
      - run:
          name: Run e2e tests
          command: |
            cd e2e
            PYTHONPATH=$PWD python3 -m pytest tests/basic/ -v 2>&1
      - store_artifacts:
          path: e2e/artifacts
          destination: serial-logs
