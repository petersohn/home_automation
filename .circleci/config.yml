version: 2.1
workflows:
  testing:
    jobs:
      - build-firmware
      - e2e-tests:
          requires:
            - build-firmware
jobs:
  build-firmware:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install arduino-cli
          command: |
            curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/.local/bin sh
            echo 'export PATH=$HOME/.local/bin:$PATH' >> $BASH_ENV
      - run:
          name: Install ESP8266 core
          command: |
            arduino-cli config init
            arduino-cli config set board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
            arduino-cli core update-index
            arduino-cli core install esp8266:esp8266
      - run:
          name: Install libraries
          command: |
            arduino-cli lib install "Adafruit MCP3008" "DallasTemperature" "DHT sensor library" "OneWire" "PubSubClient" "Grove - Laser PM2.5 Sensor HM3301" "HLW8012"
      - run:
          name: Compile firmware
          command: |
            mkdir -p /tmp/sketch/home_automation
            cp -r src *.ino /tmp/sketch/home_automation/
            arduino-cli compile --fqbn esp8266:esp8266:generic --output-dir /tmp/firmware /tmp/sketch/home_automation
      - persist_to_workspace:
          root: /tmp
          paths:
            - firmware
  e2e-tests:
    machine: true
    resource_class: petersohn/esp_rpi
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - run:
          name: Install arduino-cli on RPi
          command: |
            if ! command -v arduino-cli &>/dev/null; then
              mkdir -p $HOME/.local/bin
              curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/.local/bin sh
              echo 'export PATH=$HOME/.local/bin:$PATH' >> $BASH_ENV
            fi
      - run:
          name: Install ESP8266 core on RPi
          command: |
            if ! arduino-cli core list 2>/dev/null | grep -q esp8266; then
              arduino-cli config init
              arduino-cli config set board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
              arduino-cli core update-index
              arduino-cli core install esp8266:esp8266
            fi
      - run:
          name: Install Python dependencies
          command: |
            pip3 install --break-system-packages pytest paho-mqtt pyserial RPi.GPIO
            sudo usermod -aG gpio circleci
      - run:
          name: Upload firmware
          command: python3 flash.py -p /dev/serial0 upload --image /tmp/firmware/home_automation.ino.bin
      - run:
          name: Run e2e tests
          command: |
            cd e2e
            PYTHONPATH=$PWD python3 -m pytest tests/basic/ -v 2>&1
      - store_artifacts:
          path: e2e/artifacts
          destination: serial-logs