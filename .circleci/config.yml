version: 2.1
workflows:
  testing:
    jobs:
      - build-firmware
      - e2e-tests:
          requires:
            - build-firmware
jobs:
  build-firmware:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install arduino-cli
          command: |
            curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/.local/bin sh
            echo 'export PATH=$HOME/.local/bin:$PATH' >> $BASH_ENV
      - run:
          name: Install ESP8266 core
          command: |
            arduino-cli config init
            arduino-cli config set board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
            arduino-cli core update-index
            arduino-cli core install esp8266:esp8266
      - run:
          name: Compile firmware
          command: arduino-cli compile --fqbn esp8266:esp8266:generic -o /tmp/firmware.bin
      - persist_to_workspace:
          root: /tmp
          paths:
            - firmware.bin
  e2e-tests:
    machine: true
    resource_class: petersohn/esp_rpi
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - run:
          name: Upload firmware
          command: python3 flash.py upload --image /tmp/firmware.bin --port /dev/serial0
      - run:
          name: Run e2e tests
          command: |
            cd e2e
            python3 -m pytest tests/basic/ -v --ci 2>&1
      - store_artifacts:
          path: e2e/artifacts
          destination: serial-logs