[tool.mypy]
warn_no_return = true
disallow_untyped_defs = true
disallow_untyped_calls = true
explicit_package_bases = true
mypy_path = "e2e"
exclude = '(^|/)test/googletest/'

[[tool.mypy.overrides]]
module = ['RPi.GPIO', 'RPi', 'serial', 'paho.mqtt.client', 'paho.mqtt', 'paho', 'pytest']
ignore_missing_imports = true